# Solar Monitor: TimescaleDB + poller + web, for the Synology NAS (or any Docker host).
#
# Images come from GHCR (built by .github/workflows/images.yml). Site config (inverter IPs and
# serials, DB password) comes from a .env file next to this one; see .env.example. Nothing site-
# specific belongs in this file: the repo is public.
#
# docker-compose v1 (DSM 7.1) needs the version key and has no `name:`; the project name is the
# folder name, or COMPOSE_PROJECT_NAME.
version: '3.9'

x-db-connection: &db-connection "Host=timescaledb;Database=solarmonitor;Username=solarmonitor;Password=${DB_PASSWORD}"

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  timescaledb:
    image: timescale/timescaledb:2.31.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: solarmonitor
      POSTGRES_USER: solarmonitor
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"   # LAN access for psql/pgAdmin. 5433, not 5432, to stay clear of anything on the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarmonitor -d solarmonitor"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  poller:
    image: ghcr.io/sixtymage/solar-monitor-poller:${TAG:-latest}
    restart: unless-stopped
    environment:
      ConnectionStrings__SolarMonitor: *db-connection
      Poller__IntervalSeconds: ${POLL_INTERVAL_SECONDS:-10}
      TZ: ${TZ:-UTC}
      Inverters__0__Name: ${INVERTER_0_NAME:-}
      Inverters__0__Host: ${INVERTER_0_HOST:-}
      Inverters__0__LoggerSerial: ${INVERTER_0_DONGLE_SERIAL:-0}
      Inverters__0__InverterSerial: ${INVERTER_0_INVERTER_SERIAL:-}
      Inverters__1__Name: ${INVERTER_1_NAME:-}
      Inverters__1__Host: ${INVERTER_1_HOST:-}
      Inverters__1__LoggerSerial: ${INVERTER_1_DONGLE_SERIAL:-0}
      Inverters__1__InverterSerial: ${INVERTER_1_INVERTER_SERIAL:-}
      Inverters__2__Name: ${INVERTER_2_NAME:-}
      Inverters__2__Host: ${INVERTER_2_HOST:-}
      Inverters__2__LoggerSerial: ${INVERTER_2_DONGLE_SERIAL:-0}
      Inverters__2__InverterSerial: ${INVERTER_2_INVERTER_SERIAL:-}
    depends_on:
      - timescaledb     # the poller also retries until the database answers
    logging: *logging

  web:
    image: ghcr.io/sixtymage/solar-monitor-web:${TAG:-latest}
    restart: unless-stopped
    environment:
      ConnectionStrings__SolarMonitor: *db-connection
      TZ: ${TZ:-UTC}
    ports:
      - "${WEB_PORT:-8090}:8080"
    depends_on:
      - timescaledb
    logging: *logging

volumes:
  timescaledb_data:
